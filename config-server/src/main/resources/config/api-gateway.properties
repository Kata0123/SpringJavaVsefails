
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=recommendation-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[0].order=-30
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/media/random,/api/recommendations/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=recommendationBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/recommendation
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes[0]=INTERNAL_SERVER_ERROR
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes[1]=BAD_GATEWAY
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes[2]=SERVICE_UNAVAILABLE
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes[3]=GATEWAY_TIMEOUT

spring.cloud.gateway.server.webflux.routes[1].id=catalog-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[1].order=-20
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog,/api/media/**,/api/reference/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=catalogBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/catalog
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[0]=INTERNAL_SERVER_ERROR
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[1]=BAD_GATEWAY
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[2]=SERVICE_UNAVAILABLE
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[3]=GATEWAY_TIMEOUT

spring.cloud.gateway.server.webflux.routes[2].id=main-site-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://GUCCISPRING
spring.cloud.gateway.server.webflux.routes[2].order=100
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/**

resilience4j.circuitbreaker.instances.catalogBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.catalogBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.catalogBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalogBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.catalogBreaker.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.recommendationBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.recommendationBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.recommendationBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.recommendationBreaker.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.recommendationBreaker.registerHealthIndicator=true

spring.cloud.gateway.metrics.enabled=true

info.app.name=api-gateway
info.app.description=Routing and Circuit Breaker
info.app.version=4.0
