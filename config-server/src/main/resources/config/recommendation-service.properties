
server.port=8083

info.app.name=recommendation-service
info.app.description=Random Movies and Recommendations
info.app.version=4.0

resilience4j.circuitbreaker.instances.catalogLookup.slidingWindowSize=10
resilience4j.circuitbreaker.instances.catalogLookup.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.catalogLookup.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalogLookup.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.catalogLookup.registerHealthIndicator=true
