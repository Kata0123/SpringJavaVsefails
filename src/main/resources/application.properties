
spring.application.name=guccispring
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:postgresql://localhost:5432/films_series
spring.datasource.username=postgres
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.add-mappings=true
server.error.include-message=never

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

tmdb.api-token=${TMDB_API_TOKEN:}

logging.level.org.example.guccispring=INFO

server.port=8081
server.address=0.0.0.0

posters.storage-dir=./src/main/resources/static/img/posters
people.storage-dir=./src/main/resources/static/img/people

