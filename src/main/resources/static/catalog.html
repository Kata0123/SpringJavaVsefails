
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог — Кадр</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .catalog-search-filters {
            display: grid;
            grid-template-columns: minmax(240px, 2fr) repeat(4, minmax(0, 1fr));
            gap: 12px;
            align-items: start;
            margin-bottom: 24px;
        }

        .catalog-search-filters > #fq {
            width: 100%;
            min-width: 0;
            height: 54px;
            box-sizing: border-box;
        }

        .catalog-dropdown {
            position: relative;
            min-width: 0;
        }

        .catalog-dropdown-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            height: 54px;
            padding: 0 14px;
            border: 1px solid #292d3d;
            border-radius: 12px;
            background: #15161f;
            color: #f5f5fa;
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }

        .catalog-dropdown-button:hover,
        .catalog-dropdown.open .catalog-dropdown-button {
            border-color: #d9912c;
            background: #1c1a1c;
        }

        .catalog-dropdown-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .catalog-dropdown-button svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            transition: transform .2s;
        }

        .catalog-dropdown.open .catalog-dropdown-button svg {
            transform: rotate(180deg);
        }

        .catalog-dropdown-menu {
            position: absolute;
            z-index: 200;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            min-width: 210px;
            display: none;
            padding: 12px;
            border: 1px solid #35394a;
            border-radius: 15px;
            background: #171820;
            box-shadow: 0 18px 42px rgba(0, 0, 0, .55);
        }

        .catalog-dropdown.open .catalog-dropdown-menu {
            display: block;
        }

        .catalog-dropdown-search {
            display: block;
            width: 100%;
            height: 42px;
            box-sizing: border-box;
            padding: 0 12px;
            margin-bottom: 10px;
            border: 1px solid #36394a;
            border-radius: 9px;
            background: #0d0e15;
            color: #fff;
            outline: none;
            font-family: "Manrope", sans-serif;
            font-size: 13px;
        }

        .catalog-dropdown-search:focus {
            border-color: #f7b83f;
        }

        .catalog-dropdown-search::placeholder {
            color: #8e96aa;
        }

        .catalog-dropdown-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 280px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .catalog-dropdown-options::-webkit-scrollbar {
            width: 6px;
        }

        .catalog-dropdown-options::-webkit-scrollbar-thumb {
            background: #45485a;
            border-radius: 10px;
        }

        .catalog-dropdown-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 38px;
            padding: 9px 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #c7d1e5;
            font-family: "Manrope", sans-serif;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }

        .catalog-dropdown-option:hover,
        .catalog-dropdown-option:focus-visible {
            background: #292b37;
            color: #fff;
        }

        .catalog-dropdown-option.selected {
            background: rgba(213, 133, 37, .22);
            color: #ffd18a;
        }

        .catalog-dropdown-option.selected::after {
            content: "✓";
            font-weight: 800;
            color: #ffbd3c;
        }

        .catalog-dropdown-empty {
            padding: 14px 10px;
            color: #99a2b7;
            font-size: 13px;
            text-align: center;
        }

        .catalog-dropdown-button:focus-visible,
        .catalog-dropdown-option:focus-visible {
            outline: 2px solid #ffbd3c;
            outline-offset: 2px;
        }

        .catalog-native-select,
        #tags.catalog-source-tags {
            display: none !important;
        }

        @media (max-width: 1200px) {
            .catalog-search-filters {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .catalog-search-filters > #fq {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 750px) {
            .catalog-search-filters {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .catalog-dropdown-button {
                font-size: 13px;
                padding: 0 12px;
            }

            .catalog-dropdown-menu {
                min-width: 0;
            }
        }

        @media (max-width: 420px) {
            .catalog-dropdown-button {
                font-size: 12px;
            }
        }
    </style>
</head>

<body data-page="catalog">

<header class="top" id="top">
    <a class="logo" href="index.html">Кадр</a>

    <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="wheel.html">Фильм на вечер</a>
    </nav>

    <div class="auth" id="auth"></div>
</header>

<section class="wrap page">
    <h2 id="ctitle">Каталог</h2>

    <div class="filters catalog-search-filters">
        <input
                id="fq"
                type="search"
                placeholder="Поиск по названию"
                aria-label="Поиск"
        >

        <div class="catalog-dropdown" data-filter="fg">
            <button type="button" class="catalog-dropdown-button" aria-expanded="false">
                <span class="catalog-dropdown-label">Все жанры</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>
            <div class="catalog-dropdown-menu">
                <input
                        type="search"
                        class="catalog-dropdown-search"
                        placeholder="Найти жанр..."
                        aria-label="Поиск жанра"
                        autocomplete="off"
                >
                <div class="catalog-dropdown-options"></div>
            </div>
        </div>

        <div class="catalog-dropdown" data-filter="fy">
            <button type="button" class="catalog-dropdown-button" aria-expanded="false">
                <span class="catalog-dropdown-label">Любой год</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>
            <div class="catalog-dropdown-menu">
                <input
                        type="search"
                        class="catalog-dropdown-search"
                        placeholder="Найти год..."
                        aria-label="Поиск года"
                        autocomplete="off"
                >
                <div class="catalog-dropdown-options"></div>
            </div>
        </div>

        <div class="catalog-dropdown" data-filter="ft">
            <button type="button" class="catalog-dropdown-button" aria-expanded="false">
                <span class="catalog-dropdown-label">Фильмы и сериалы</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>
            <div class="catalog-dropdown-menu">
                <input
                        type="search"
                        class="catalog-dropdown-search"
                        placeholder="Найти тип..."
                        aria-label="Поиск типа"
                        autocomplete="off"
                >
                <div class="catalog-dropdown-options"></div>
            </div>
        </div>

        <div class="catalog-dropdown" data-filter="tags">
            <button type="button" class="catalog-dropdown-button" aria-expanded="false">
                <span class="catalog-dropdown-label">Все теги</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>
            <div class="catalog-dropdown-menu">
                <input
                        type="search"
                        class="catalog-dropdown-search"
                        placeholder="Найти тег..."
                        aria-label="Поиск тега"
                        autocomplete="off"
                >
                <div class="catalog-dropdown-options"></div>
            </div>
        </div>

        <select id="fg" class="catalog-native-select" aria-label="Жанр">
            <option value="">Все жанры</option>
        </select>

        <select id="fy" class="catalog-native-select" aria-label="Год">
            <option value="">Любой год</option>
        </select>

        <select id="ft" class="catalog-native-select" aria-label="Тип">
            <option value="">Фильмы и сериалы</option>
            <option value="Фильм">Фильм</option>
            <option value="Сериал">Сериал</option>
        </select>
    </div>

    <div class="chips catalog-source-tags" id="tags"></div>

    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>

    <p class="empty" id="empty" hidden>
        Ничего не найдено. Измените запрос или сбросьте фильтры.
    </p>
</section>

<footer class="foot">
    <div class="foot-in">
        <div class="foot-brand">
            <a class="logo-row" href="index.html">
                <span class="logo-ic">
                    <svg viewBox="0 0 24 24" width="22" height="22"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>
                    </svg>
                </span>
                <span class="logo">Кадр</span>
            </a>
            <p>Фильмы и сериалы в одном месте: подборки, оценки и личный список.</p>
        </div>

        <div class="foot-col">
            <h4>Разделы</h4>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="wheel.html">На вечер</a>
        </div>
    </div>

</footer>

<dialog id="loginModal">
    <form class="login" id="loginForm">
        <button class="x" type="button" id="loginClose" aria-label="Закрыть">×</button>
        <h3>Вход</h3>
        <label>Имя пользователя<input name="name" required autocomplete="username"></label>
        <label>Пароль<input name="pass" type="password" required autocomplete="current-password"></label>
        <button class="btn">Войти</button>
    </form>
</dialog>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/catalog.js"></script>

<script>
    (function () {
        'use strict';

        const dropdowns = Array.from(
            document.querySelectorAll('.catalog-dropdown')
        );

        const tagsContainer = document.getElementById('tags');

        let chosenTag = '';

        function normalize(value) {
            return String(value || '')
                .toLocaleLowerCase('ru-RU')
                .replace(/ё/g, 'е')
                .trim();
        }

        function closeDropdown(dropdown) {
            dropdown.classList.remove('open');

            dropdown.querySelector('.catalog-dropdown-button')
                .setAttribute('aria-expanded', 'false');
        }

        function closeAll(except = null) {
            dropdowns.forEach(dropdown => {
                if (dropdown !== except) {
                    closeDropdown(dropdown);
                }
            });
        }

        function getTagElements() {
            return Array.from(
                tagsContainer.querySelectorAll('button, a')
            );
        }

        function getTagName(element) {
            return element.textContent.replace(/\s+/g, ' ').trim();
        }

        function activeTagElement() {
            return getTagElements().find(element =>
                element.classList.contains('on') ||
                element.classList.contains('active') ||
                element.classList.contains('selected') ||
                element.getAttribute('aria-pressed') === 'true'
            );
        }

        function syncTagLabel() {
            const dropdown = document.querySelector(
                '.catalog-dropdown[data-filter="tags"]'
            );

            const label = dropdown.querySelector(
                '.catalog-dropdown-label'
            );

            const active = activeTagElement();

            if (active) {
                chosenTag = getTagName(active);
            }

            if (chosenTag) {
                const exists = getTagElements().some(
                    element => getTagName(element) === chosenTag
                );

                if (!exists) {
                    chosenTag = '';
                }
            }

            label.textContent = chosenTag || 'Все теги';
        }

        function getOptions(dropdown) {
            if (dropdown.dataset.filter === 'tags') {
                return [
                    {
                        value: '',
                        text: 'Все теги'
                    },
                    ...getTagElements().map(element => ({
                        value: getTagName(element),
                        text: getTagName(element),
                        source: element
                    }))
                ];
            }

            const select = document.getElementById(
                dropdown.dataset.filter
            );

            return Array.from(select.options)
                .filter(option => !option.disabled && !option.hidden)
                .map(option => ({
                    value: option.value,
                    text: option.textContent.trim()
                }));
        }

        function getSelectedValue(dropdown) {
            if (dropdown.dataset.filter === 'tags') {
                return chosenTag;
            }

            return document.getElementById(
                dropdown.dataset.filter
            ).value;
        }

        function renderOptions(dropdown) {
            const input = dropdown.querySelector(
                '.catalog-dropdown-search'
            );

            const container = dropdown.querySelector(
                '.catalog-dropdown-options'
            );

            const query = normalize(input.value);

            const options = getOptions(dropdown)
                .filter(option =>
                    normalize(option.text).includes(query)
                );

            const fragment = document.createDocumentFragment();

            if (!options.length) {
                const empty = document.createElement('div');
                empty.className = 'catalog-dropdown-empty';
                empty.textContent = 'Ничего не найдено';
                container.replaceChildren(empty);
                return;
            }

            for (const option of options) {
                const button = document.createElement('button');

                button.type = 'button';
                button.className = 'catalog-dropdown-option';
                button.textContent = option.text;

                const selected =
                    option.value === getSelectedValue(dropdown);

                button.classList.toggle('selected', selected);
                button.setAttribute('aria-pressed', String(selected));

                button.addEventListener('click', () => {
                    chooseOption(dropdown, option);
                });

                fragment.appendChild(button);
            }

            container.replaceChildren(fragment);
        }

        function chooseOption(dropdown, option) {
            if (dropdown.dataset.filter === 'tags') {
                const previousTag = chosenTag;

                if (option.value === '') {
                    const active = activeTagElement() ||
                        getTagElements().find(
                            element => getTagName(element) === previousTag
                        );

                    if (active) {
                        active.click();
                    }

                    chosenTag = '';
                } else {
                    if (option.source) {
                        option.source.click();
                    }

                    chosenTag =
                        option.value === previousTag ? '' : option.value;
                }

                syncTagLabel();
            } else {
                const select = document.getElementById(
                    dropdown.dataset.filter
                );

                const changed = select.value !== option.value;

                select.value = option.value;

                if (changed) {
                    select.dispatchEvent(
                        new Event('change', { bubbles: true })
                    );
                }

                syncLabel(dropdown);
            }

            closeDropdown(dropdown);

            dropdown.querySelector(
                '.catalog-dropdown-button'
            ).focus();
        }

        function syncLabel(dropdown) {
            if (dropdown.dataset.filter === 'tags') {
                syncTagLabel();
                return;
            }

            const select = document.getElementById(
                dropdown.dataset.filter
            );

            const label = dropdown.querySelector(
                '.catalog-dropdown-label'
            );

            const selected = select.selectedOptions[0];

            if (selected) {
                label.textContent = selected.textContent.trim();
            }
        }

        function toggleDropdown(dropdown) {
            const wasOpen = dropdown.classList.contains('open');

            closeAll();

            if (wasOpen) {
                return;
            }

            dropdown.classList.add('open');

            dropdown.querySelector('.catalog-dropdown-button')
                .setAttribute('aria-expanded', 'true');

            const search = dropdown.querySelector(
                '.catalog-dropdown-search'
            );

            search.value = '';

            renderOptions(dropdown);
            search.focus();
        }

        function initDropdown(dropdown) {
            const trigger = dropdown.querySelector(
                '.catalog-dropdown-button'
            );

            const search = dropdown.querySelector(
                '.catalog-dropdown-search'
            );

            trigger.addEventListener('click', () => {
                toggleDropdown(dropdown);
            });

            search.addEventListener('input', () => {
                renderOptions(dropdown);
            });

            search.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    closeDropdown(dropdown);
                    trigger.focus();
                }

                if (event.key === 'Enter') {
                    event.preventDefault();

                    dropdown.querySelector(
                        '.catalog-dropdown-option'
                    )?.click();
                }

                if (event.key === 'ArrowDown') {
                    event.preventDefault();

                    dropdown.querySelector(
                        '.catalog-dropdown-option'
                    )?.focus();
                }
            });

            dropdown.querySelector(
                '.catalog-dropdown-options'
            ).addEventListener('keydown', event => {
                const buttons = Array.from(
                    dropdown.querySelectorAll(
                        '.catalog-dropdown-option'
                    )
                );

                const index = buttons.indexOf(document.activeElement);

                if (event.key === 'Escape') {
                    closeDropdown(dropdown);
                    trigger.focus();
                }

                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    buttons[Math.min(index + 1, buttons.length - 1)]?.focus();
                }

                if (event.key === 'ArrowUp') {
                    event.preventDefault();

                    if (index <= 0) {
                        search.focus();
                    } else {
                        buttons[index - 1].focus();
                    }
                }
            });

            if (dropdown.dataset.filter !== 'tags') {
                const select = document.getElementById(
                    dropdown.dataset.filter
                );

                select.addEventListener('change', () => {
                    syncLabel(dropdown);
                });

                const observer = new MutationObserver(() => {
                    syncLabel(dropdown);
                    if (dropdown.classList.contains('open')) {
                        renderOptions(dropdown);
                    }
                });

                observer.observe(select, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            syncLabel(dropdown);
        }

        dropdowns.forEach(initDropdown);

        if (tagsContainer) {
            const tagsObserver = new MutationObserver(() => {
                syncTagLabel();

                const dropdown = document.querySelector(
                    '.catalog-dropdown[data-filter="tags"]'
                );

                if (dropdown.classList.contains('open')) {
                    renderOptions(dropdown);
                }
            });

            tagsObserver.observe(tagsContainer, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'aria-pressed']
            });
        }

        document.addEventListener('click', event => {
            if (!event.target.closest('.catalog-dropdown')) {
                closeAll();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeAll();
            }
        });
    })();
</script>

</body>
</html>
